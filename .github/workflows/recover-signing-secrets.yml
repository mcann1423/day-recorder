name: Recover signing secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  export-encrypted-backup:
    runs-on: ubuntu-latest
    environment: signing-recovery
    steps:
      - name: Create encrypted signing backup
        env:
          RECOVERY_CERTIFICATE_BASE64: ${{ vars.SIGNING_RECOVERY_CERT_B64 }}
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          recovery_dir="$RUNNER_TEMP/day-recorder-signing-recovery"
          plaintext_archive="$RUNNER_TEMP/day-recorder-signing-recovery.tar.gz"
          encrypted_archive="$GITHUB_WORKSPACE/day-recorder-signing-recovery.cms"
          mkdir -p "$recovery_dir"
          cleanup() {
            rm -f "$plaintext_archive"
            find "$recovery_dir" -type f -delete
          }
          trap cleanup EXIT

          test -n "$RECOVERY_CERTIFICATE_BASE64"
          test -n "$SIGNING_KEY_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$RECOVERY_CERTIFICATE_BASE64" | base64 --decode > "$recovery_dir/recovery-certificate.pem"
          openssl x509 -in "$recovery_dir/recovery-certificate.pem" -noout -checkend 0
          printf '%s' "$SIGNING_KEY_BASE64" > "$recovery_dir/ANDROID_SIGNING_KEY_BASE64"
          printf '%s' "$KEYSTORE_PASSWORD" > "$recovery_dir/ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$KEY_ALIAS" > "$recovery_dir/ANDROID_KEY_ALIAS"
          printf '%s' "$KEY_PASSWORD" > "$recovery_dir/ANDROID_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$recovery_dir/day-recorder-release.jks"

          tar -C "$recovery_dir" -czf "$plaintext_archive" \
            ANDROID_SIGNING_KEY_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            day-recorder-release.jks
          openssl cms -encrypt \
            -binary \
            -aes-256-cbc \
            -in "$plaintext_archive" \
            -out "$encrypted_archive" \
            -outform DER \
            "$recovery_dir/recovery-certificate.pem"
          test -s "$encrypted_archive"
          sha256sum "$encrypted_archive"

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: day-recorder-signing-recovery-${{ github.run_id }}
          path: day-recorder-signing-recovery.cms
          if-no-files-found: error
          retention-days: 1
