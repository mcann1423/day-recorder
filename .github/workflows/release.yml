name: Build signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/day-recorder-release.jks"
          chmod 600 "$RUNNER_TEMP/day-recorder-release.jks"

      - name: Test, lint, and build signed APKs
        env:
          DAY_RECORDER_KEYSTORE_PATH: ${{ runner.temp }}/day-recorder-release.jks
          DAY_RECORDER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAY_RECORDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAY_RECORDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean test lint assembleRelease

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --verbose phone/build/outputs/apk/release/phone-release.apk

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          phone_version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' phone/build.gradle.kts | head -1)
          phone_version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' phone/build.gradle.kts | head -1)
          test -n "$version_name"
          test -n "$version_code"
          test -n "$phone_version_name"
          test -n "$phone_version_code"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version_name"
          fi
          mkdir -p release-assets
          watch_name="day-recorder-watch-v${version_name}-build${version_code}-release.apk"
          phone_name="day-recorder-phone-v${phone_version_name}-build${phone_version_code}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$watch_name"
          cp phone/build/outputs/apk/release/phone-release.apk "release-assets/$phone_name"
          (cd release-assets && sha256sum "$watch_name" > "$watch_name.sha256")
          (cd release-assets && sha256sum "$phone_name" > "$phone_name.sha256")
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.assets.outputs.version_name }}
          VERSION_CODE: ${{ steps.assets.outputs.version_code }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Day Recorder v${VERSION_NAME} (Build ${VERSION_CODE})" \
            --notes "Device-update validation release for the Wear OS recorder and Android phone companion. This release advances the watch to v1.8.3 (build 13) and the phone companion to build 6 so the hardened in-app updater can be tested against a newer signed production release."
