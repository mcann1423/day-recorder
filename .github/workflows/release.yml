name: Build signed release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test, lint, and build unsigned APKs
        run: ./gradlew clean test lint assembleRelease

      - name: Verify unsigned release outputs
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f phone/build/outputs/apk/release/phone-release-unsigned.apk

      - name: Stage unsigned APKs
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          mkdir -p unsigned-apks
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned-apks/watch.apk
          cp phone/build/outputs/apk/release/phone-release-unsigned.apk unsigned-apks/phone.apk

      - name: Upload unsigned APKs
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-apks-${{ github.sha }}
          path: unsigned-apks
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Download validated unsigned APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-apks-${{ github.sha }}
          path: unsigned-apks

      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/day-recorder-release.jks"
          chmod 600 "$RUNNER_TEMP/day-recorder-release.jks"

      - name: Sign APKs without invoking the build system
        env:
          DAY_RECORDER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAY_RECORDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAY_RECORDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          test -x "$apksigner"
          test -x "$zipalign"
          test -n "$DAY_RECORDER_KEYSTORE_PASSWORD"
          test -n "$DAY_RECORDER_KEY_ALIAS"
          test -n "$DAY_RECORDER_KEY_PASSWORD"
          mkdir -p signed-apks
          "$zipalign" -c -P 16 4 unsigned-apks/watch.apk
          "$zipalign" -c -P 16 4 unsigned-apks/phone.apk
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/day-recorder-release.jks" \
            --ks-key-alias "$DAY_RECORDER_KEY_ALIAS" \
            --ks-pass env:DAY_RECORDER_KEYSTORE_PASSWORD \
            --key-pass env:DAY_RECORDER_KEY_PASSWORD \
            --out signed-apks/watch.apk \
            unsigned-apks/watch.apk
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/day-recorder-release.jks" \
            --ks-key-alias "$DAY_RECORDER_KEY_ALIAS" \
            --ks-pass env:DAY_RECORDER_KEYSTORE_PASSWORD \
            --key-pass env:DAY_RECORDER_KEY_PASSWORD \
            --out signed-apks/phone.apk \
            unsigned-apks/phone.apk
          "$apksigner" verify --verbose --print-certs signed-apks/watch.apk
          "$apksigner" verify --verbose --print-certs signed-apks/phone.apk

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          phone_version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' phone/build.gradle.kts | head -1)
          phone_version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' phone/build.gradle.kts | head -1)
          test -n "$version_name"
          test -n "$version_code"
          test -n "$phone_version_name"
          test -n "$phone_version_code"
          test "$GITHUB_REF_NAME" = "v$version_name"
          mkdir -p release-assets
          watch_name="day-recorder-watch-v${version_name}-build${version_code}-release.apk"
          phone_name="day-recorder-phone-v${phone_version_name}-build${phone_version_code}-release.apk"
          cp signed-apks/watch.apk "release-assets/$watch_name"
          cp signed-apks/phone.apk "release-assets/$phone_name"
          (cd release-assets && sha256sum "$watch_name" > "$watch_name.sha256")
          (cd release-assets && sha256sum "$phone_name" > "$phone_name.sha256")
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.assets.outputs.version_name }}
          VERSION_CODE: ${{ steps.assets.outputs.version_code }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Day Recorder v${VERSION_NAME} (Build ${VERSION_CODE})" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/day-recorder-release.jks"
